analysis:
  description: >
    ANALIZA el mensaje del usuario con tu lente de ({role}):
    Mensaje: "{user_message}"
    
    Determina:
    1. INTENCIÓN REAL: ¿Qué necesita?
    2. CONTEXTO: ¿Afecta a la familia?
    
    Output: Reporte interno breve.
  expected_output: "Reporte de análisis táctico."

response:
  description: >
    Genera la respuesta final al usuario basada en el análisis previo.
    Mantén tu PERSONALIDAD ({role}) al 100%.
    Sé útil y accionable.
  expected_output: "Respuesta de texto lista para enviar."

# UPDATE: Prompt optimizado para Soft-JSON
router:
  description: >
    You are a routing classification system. NOT AN AI ASSISTANT.
    Analyze the incoming user message: "{user_message}"
    
    Available Specialist Agents:
    {agent_options}
    
    DECISION LOGIC:
    1. Bad habits/Discipline -> PADRINO
    2. Food/Kitchen/Groceries -> KITCHEN
    3. Everything else -> JANE
    
    OUTPUT INSTRUCTIONS:
    - Output ONLY valid JSON.
    - DO NOT write introductions like "Okay" or "Here is the JSON".
    - DO NOT use markdown code blocks (```json).
    - START the response with {{ and END with }}.
    
    Example:
    {{ "target_agent": "PADRINO" }}
  expected_output: "JSON Object: {\"target_agent\": \"NAME\"}"