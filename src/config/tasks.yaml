analysis:
  description: >
    ANALIZA el mensaje del usuario con tu lente de ({role}):
    Mensaje: "{user_message}"
    
    Determina:
    1. INTENCIÓN REAL: ¿Qué necesita?
    2. CONTEXTO: ¿Afecta a la familia?
    
    Output: Reporte interno breve.
  expected_output: "Reporte de análisis táctico."

response:
  description: >
    Genera la respuesta final al usuario basada en el análisis previo.
    Mantén tu PERSONALIDAD ({role}) al 100%.
    Sé útil y accionable.
  expected_output: "Respuesta de texto lista para enviar."

# UPDATE: Prompt optimizado para Soft-JSON
router:
  description: >
    You are a routing classification system.
    Analyze the incoming user message (which may contain text descriptions of images): "{user_message}"
    
    Available Specialist Agents:
    {agent_options}
    
    DECISION LOGIC (STRICT):
    1. Food / Cooking / Groceries / Fridge Photos -> KITCHEN
    2. Calendar / General / Admin / Unknown -> JANE
    
    OUTPUT INSTRUCTIONS:
    - Output ONLY valid JSON.
    - START with { and END with }.
    - Do NOT output markdown blocks.
    - If you are NOT confident about which agent fits, DEFAULT to JANE (the generalist).
    - Only select KITCHEN when the message contains clear food/cooking/grocery evidence (words or images).
    
    Example:
    { "target_agent": "KITCHEN" }
  expected_output: "JSON Object: {\"target_agent\": \"NAME\"}"