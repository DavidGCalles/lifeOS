analysis:
  description: >
    ANALIZA el mensaje del usuario con tu lente de ({role}):
    Mensaje: "{user_message}"
    
    Determina:
    1. INTENCIÓN REAL: ¿Qué necesita?
    2. CONTEXTO: ¿Afecta a la familia?
    
    Output: Reporte interno breve.
  expected_output: "Reporte de análisis táctico."

response:
  description: >
    Genera la respuesta final al usuario basada en el análisis previo.
    Mantén tu PERSONALIDAD ({role}) al 100%.
    Sé útil y accionable.
  expected_output: "Respuesta de texto lista para enviar."

# UPDATE: Prompt optimizado para Soft-JSON
router:
  description: >
    You are a routing classification system.
    Analyze the incoming user message (which may contain text descriptions of images): "{user_message}"
    
    Available Specialist Agents:
    {agent_options}
    
    DECISION LOGIC (STRICT):
    1. Calendar / General / Admin / Unknown -> JANE
    
    OUTPUT INSTRUCTIONS:
    - Output ONLY valid JSON.
    - START with { and END with }.
    - Do NOT output markdown blocks.
    - If you are NOT confident about which agent fits, DEFAULT to JANE (the generalist).
    
    Example:
    { "target_agent": "JANE" }
  expected_output: "JSON Object: {\"target_agent\": \"NAME\"}"

memory_consolidation:
  description: >
    Analiza la siguiente transcripción y extrae SOLO los hechos concretos, 
    decisiones, planes, o preferencias del usuario.

    REGLAS ESTRICTAS DE CLASIFICACIÓN:
    - category: Debe ser exactamente uno de: {categories}
    - type: Debe ser exactamente uno de: {types}

    PATRONES DE REDACCIÓN (OBLIGATORIO):
    Escribe el hecho como una verdad universal en tercera persona, centrada en la entidad real. 
    
    EJEMPLOS DE LO QUE DEBES HACER (BIEN):
    - "La pareja del usuario es Natalia."
    - "El usuario tiene un dolor en el hombro."
    - "Gabriel es el hijo del usuario."
    
    EJEMPLOS DE LO QUE NUNCA DEBES HACER (MAL):
    - "LifeOS recuerda a Natalia como la pareja." (Contiene al sistema)
    - "El usuario menciona que le duele el hombro." (Contiene verbos de diálogo)
    - "David confirmó que Gabriel es su hijo." (Contiene narrativa del chat)

    Debes devolver ÚNICAMENTE un array JSON válido sin bloques de markdown:
    [
      {
        "fact": "La pareja del usuario es Natalia.",
        "category": "family",
        "type": "fact",
        "tags": ["pareja", "natalia"]
      }
    ]

    Transcripción a analizar:
    {conversation_history}