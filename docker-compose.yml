services:
  lifeos:
    build: .
    container_name: lifeos
    depends_on:
      - litellm
    env_file:
      - .env
    environment:
      # This is a required override to use the correct path inside the container.
      - GOOGLE_APPLICATION_CREDENTIALS=/app/src/config/credentials.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    ports:
      - "8080:8080"

  lifeos_worker:
    build: .
    container_name: lifeos_worker
    depends_on:
      - litellm
    env_file:
      - .env
    environment:
      # This is a required override to use the correct path inside the container.
      - GOOGLE_APPLICATION_CREDENTIALS=/app/src/config/credentials.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    ports:
      - "8081:8080"
    command: ["python", "main_worker.py"]

  lifeos_scheduler:
    image: alpine:latest
    container_name: lifeos_scheduler
    depends_on:
      - lifeos_worker
    env_file:
      - .env
    volumes:
      - .:/app
      - /var/spool/cron/crontabs:/var/spool/cron/crontabs
    working_dir: /app
    entrypoint: >
      sh -c "
        apk add --no-cache curl yq &&
        chmod +x /app/scripts/setup_crontab.sh &&
        /app/scripts/setup_crontab.sh
      "
    networks:
      default:
        aliases:
          - scheduler

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: lifeos_litellm
    ports:
      - "4000:4000"
    volumes:
      - ./src/config/litellm_config.edge.yaml:/app/config.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    # Arranca con debug para ver si saltan los fallbacks
    command: "--config /app/config.yaml --port 4000 --detailed_debug"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: lifeos_qdrant
    ports:
      - "6333:6333" # REST API and Dashboard UI
      - "6334:6334" # gRPC Port (internal)
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      # If you want to secure locally, uncomment this:
      # - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
      - QDRANT__TELEMETRY_DISABLED=true
    restart: always

  lifeos_embeddings:
    build:
      context: .
      dockerfile: Dockerfile.infinity
    container_name: lifeos_embeddings
    ports:
      - "7997:8080"
    volumes:
      - ./data/infinity_models:/models
    command: ["--model-id", "/data/model", "--model-id", "/data/nli_model"]
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg15
    container_name: lifeos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifeos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lifeos_edge}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-lifeos_user} -d $${POSTGRES_DB:-lifeos_edge}"]
      interval: 5s
      timeout: 5s
      retries: 5