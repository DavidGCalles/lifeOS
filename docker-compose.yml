# LifeOS v3 — edge compose (v3-FR-01)
# Substrate = coreAI via submodule (./coreAI, ver scripts/bootstrap.sh) + include.
# CERO GCP: sin Cloud Build/Run/Scheduler/Firestore; todo on-prem.
# Con include (Compose v2.20+), los paths relativos del archivo incluido se
# resuelven dentro de coreAI/ (su propio project directory):
#   volumes -> coreAI/data/..., env_file -> coreAI/.env, build context -> coreAI/
name: lifeos-edge

include:
  - coreAI/docker-compose.yml

services:
  # Healthchecks que coreAI no define para estos servicios; se añaden aqui
  # (override del edge, coreAI no se toca).
  qdrant:
    healthcheck:
      # la imagen qdrant no trae curl/wget; bash si, y /dev/tcp es builtin
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1:6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  litellm:
    healthcheck:
      # gateway LLM: probe ligero /health/liveliness (sin auth, sin llamadas a
      # modelos). /health es diagnostico de admin: testea cada modelo y puede
      # pedir API key — falso unhealthy garantizado en el edge.
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:4000/health/liveliness', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  worker-node:
    healthcheck:
      # sin HTTP: el proceso vivo es el check (solo python + /proc, sin ps/pgrep en slim)
      test: ["CMD-SHELL", "python -c \"import os,sys; ok=any('src.worker' in open('/proc/'+p+'/cmdline','rb').read().decode(errors='ignore') for p in os.listdir('/proc') if p.isdigit()); sys.exit(0 if ok else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================================
  # SERVICIOS PROPIOS DEL EDGE
  # ==========================================================

  edge-bot:
    # v3-FR-02a (#168) + v3-FR-02b (#169): loop del bot — Telegram 1:1 →
    # persona por defecto (Jane, personas/agents.yaml) → LLM vía gateway de
    # coreAI (litellm, modelo local-fallback) → respuesta al chat. Desde el
    # 02b Jane tiene DOS tools de borde (memory_save/memory_recall) que se
    # traducen a los contratos del substrato por MCP (core-mcp, sesión por
    # llamada). El edge sigue sin persistir nada propio: sin volúmenes, la
    # ventana efímera vive en RAM y la memoria persistente es la de coreAI.
    build:
      context: .
      dockerfile: Dockerfile
    image: lifeos/edge-bot:local
    container_name: lifeos_edge_bot
    restart: unless-stopped
    env_file:
      - path: .env
        # required: false → el stack de v3-FR-01 sigue arrancando sin .env;
        # el edge-bot hace fail-fast con mensaje claro si falta el token.
        required: false
    environment:
      LITELLM_BASE_URL: http://litellm:4000/v1
      # frontera MCP del substrato (service del compose incluido, misma red
      # coreai_backend). Sin depends_on de core-mcp a propósito: el cliente
      # es sesión-por-llamada y el bot sobrevive (aviso de Jane) a un
      # core-mcp caído o reiniciándose — un gating aquí no aporta nada.
      CORE_MCP_URL: http://core-mcp:8000/mcp
    depends_on:
      litellm:
        # gating honesto: el gateway espera a Infinity (start_period 10m en
        # coreAI); el bot no arranca antes de poder servir chat de verdad.
        condition: service_healthy
    networks:
      - coreai_backend
    healthcheck:
      # mismo patrón verificado que litellm/infinity (python urllib, sin curl)
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8080/health', timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      # mismo patrón Loki del stack (driver-side: la URL la resuelve el daemon
      # del host, donde Loki escucha en 127.0.0.1:3100)
      driver: loki
      options:
        loki-url: "http://127.0.0.1:3100/loki/api/v1/push"
        mode: non-blocking
        loki-retries: "3"
