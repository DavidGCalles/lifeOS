model_list:
  # MODELO REAL Y ESTABLE (Enero 2025)
  - model_name: crewai-proxy
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      rpm: 1000  # Subimos RPM para evitar rate-limits tontos

  # Embeddings (Crucial para la memoria)
  - model_name: text-embedding-004
    litellm_params:
      model: gemini/text-embedding-004
      api_key: os.environ/GEMINI_API_KEY

router_settings:
  # Simplificamos el routing al máximo para aislar el fallo
  allowed_fails: 1
  cooldown_time: 1