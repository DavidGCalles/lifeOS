model_list:
  # ==========================================================
  # LOCAL-ONLY CONFIGURATION (Development)
  # All model groups point to a local LM Studio / Ollama endpoint
  # reachable from containers at http://host.docker.internal:1234/v1
  # ==========================================================

  # Agents with Tools (crewai-proxy)
  - model_name: crewai-proxy
    litellm_params:
      model: openai/local-model
      api_base: "http://host.docker.internal:1234/v1"
      api_key: "lm-studio"
      rpm: 1000
      tpm: 1000000

  # Router (router-model)
  - model_name: router-model
    litellm_params:
      model: openai/local-model
      api_base: "http://host.docker.internal:1234/v1"
      api_key: "lm-studio"
      rpm: 1000
      tpm: 1000000

  # Vision (vision-model)
  - model_name: vision-model
    litellm_params:
      model: openai/local-model
      api_base: "http://host.docker.internal:1234/v1"
      api_key: "lm-studio"
      rpm: 1000
      tpm: 1000000

  - model_name: text-embedding-004
    litellm_params:
      model: gemini/text-embedding-004
      api_key: os.environ/GEMINI_API_KEY

  # Local fallback (explicit)
  - model_name: local-fallback
    litellm_params:
      model: openai/local-model
      api_base: "http://host.docker.internal:1234/v1"
      api_key: "lm-studio"
      rpm: 1000
      tpm: 1000000

router_settings:
  fallbacks:
    - "crewai-proxy": ["local-fallback"]
    - "router-model": ["local-fallback"]
    - "vision-model": ["local-fallback"]
  allowed_fails: 3
  cooldown_time: 1